
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Rumah Makan Lezat</title>

    <link rel="stylesheet" href="css/pembayaran.css">
</head>
<body>

    <header>
        <h1>🍜 Rumah Makan Lezat</h1>
        <p>Halaman Pembayaran</p>
    </header>

    <div class="container">

        <h2>Form Pembayaran</h2>

        <label>Nama Pembeli</label>
        <input type="text" id="nama" placeholder="Masukkan nama Anda">

        <label>Pilih Menu</label>
        <select id="menu">
            <option value="">-- Pilih Menu --</option>
            <option value="20000">Coto Makassar</option>
            <option value="15000">Somay Ayam</option>
            <option value="18000">Ikan Bakar</option>
            <option value="10000">Es Teler</option>
            <option value="15000">Piscok Lumer</option>
            <option value="10000">Risol Mayo</option>
            <option value="18000">Sup Ayam</option>
            <option value="6000">Bakwan Sayur</option>
            <option value="20000">Bakso</option>
            <option value="30000">Donat Kentang</option>
        </select>

        <label>Jumlah Pesanan</label>
        <input type="number" id="jumlah" value="1" min="1">

        <label>Metode Pembayaran</label>
        <select id="metode">
            <option value="">-- Pilih Pembayaran --</option>
            <option value="Tunai">Tunai</option>
            <option value="Transfer Bank">Transfer Bank</option>
            <option value="QRIS">QRIS</option>
        </select>

        <button type="button" id="btnHitung">
            Hitung Total
        </button>

        <div class="total">
            <h3>Total Pembayaran</h3>
            <h2 id="total">Rp0</h2>
        </div>

        <button type="button" id="btnBayar" class="bayar">
            Bayar Sekarang
        </button>

        <div id="struk" class="struk"></div>

        <a href="index.html" class="kembali">Kembali ke Menu</a>

    </div>

    <footer>
        <p>&copy; 2026 Rumah Makan Lezat</p>
    </footer>

    <script src="js/pembayaran.js"></script>

</body>
</html>
